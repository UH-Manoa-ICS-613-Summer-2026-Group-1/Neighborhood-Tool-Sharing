services:
  db:
    image: postgres:18.4
    container_name: tool_share_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: tool_share_storage
    volumes:
      - minio_data:/data 
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 3
  web:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tool_share_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - ./backend:/app 
    ports:
      - "5000:5000"
    environment:
      # Print statements to the console
      - PYTHONUNBUFFERED=1
      # Database
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - TEST_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}_test
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Frontend url
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      # Minio
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - STORAGE_INTERNAL_ENDPOINT=${STORAGE_INTERNAL_ENDPOINT}
      - STORAGE_EXTERNAL_ENDPOINT=${STORAGE_EXTERNAL_ENDPOINT}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
    depends_on:
          db:
            condition: service_healthy
          minio:
            condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/api/health\")'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  minio_data: