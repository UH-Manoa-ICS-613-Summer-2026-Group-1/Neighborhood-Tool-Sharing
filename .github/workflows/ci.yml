name: Neighborhood Tool Sharing App - CI Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./backend/qa/requirements-qa.txt
      
      # Pytest with Docker
      - name: Run pytest tests 
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          STORAGE_INTERNAL_ENDPOINT: ${{ secrets.STORAGE_INTERNAL_ENDPOINT }}
          STORAGE_EXTERNAL_ENDPOINT: ${{ secrets.STORAGE_EXTERNAL_ENDPOINT }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
        run: |
          docker compose run --rm web \
          python -m pytest tests \
          --cov=app \
          --cov-branch \
          --cov-report=term-missing
          docker compose down --volumes
        
      - name: Run Ruff linter 
        run: python -m ruff check . 

      # Bandit tests with Docker
      - name: Run Bandit tests (medium/high severity, high confidence) 
        run: |
          python -m bandit \
          -r app -ll -iii

      - name: Run SQLFluff linter 
        run: python -m sqlfluff lint .
        
#      - name: Run pip-audit linter
#        run: python -m pip_audit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with: 
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests 
        run: npm run test    
        
      - name: Run linter 
        run: npm run lint 

      - name: Run build
        run: npm run build